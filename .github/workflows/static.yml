# Check the books on every push. GitHub Pages serves the committed pages in docs/ straight from main,
# so this workflow does not deploy; it fails a push whose books are broken or whose built pages are stale.
name: Check the books

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check every book
        run: node engine/cli/picture-book.js check --all
      - name: The committed pages match the sources
        run: |
          node engine/cli/picture-book.js build --all --pages
          git status --porcelain docs
          test -z "$(git status --porcelain docs)"
